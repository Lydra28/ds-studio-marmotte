name: Qualifier le starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Un blocage (lanceur, 2026-11-02) vire au rouge au lieu d'occuper le runner 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Dépendances du serveur (paquet à part, server/package.json) : tsc les type-vérifie.
      - run: npm --prefix server ci
      - run: npm run build
      # Bundle du serveur desktop à blanc : une régression du bundle casse ici, pas au tag.
      - run: node scripts/build-desktop.mjs
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:launcher
      - run: npm run qualify
      - run: npm run scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Site vitrine (lot 7) : build Astro hors ligne, pages, CSP et compte simulé.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix site ci
      - run: npx playwright install chromium
      - run: npm run test:site

  # Serveur DS-Studio (lot 2) : mêmes tests sur PGlite puis sur un vrai Postgres, bundle à blanc.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ds
          POSTGRES_PASSWORD: ds
          POSTGRES_DB: ds_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run test:server
      - run: npm run test:server
        env:
          DATABASE_URL: postgres://ds:ds@localhost:5432/ds_test
      - run: npm run build:server
