<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    padding: 12px;
    font: 12px/1.45 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #222);
    background: var(--figma-color-bg, #fff);
  }
  h1 {
    font-size: 13px;
    margin: 0 0 8px;
  }
  h2 {
    font-size: 12px;
    margin: 14px 0 6px;
  }
  label {
    display: block;
    margin: 6px 0 2px;
    color: var(--figma-color-text-secondary, #666);
  }
  input,
  select,
  button {
    font: inherit;
    box-sizing: border-box;
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--figma-color-border, #ccc);
    background: var(--figma-color-bg, #fff);
    color: inherit;
  }
  button {
    cursor: pointer;
    margin-top: 8px;
  }
  button.primary {
    background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #fff);
    border-color: transparent;
    font-weight: 600;
  }
  button.danger {
    background: var(--figma-color-bg-danger, #f24822);
    color: var(--figma-color-text-ondanger, #fff);
    border-color: transparent;
    font-weight: 600;
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .card {
    border: 1px solid var(--figma-color-border, #ddd);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 8px;
  }
  .ok {
    color: var(--figma-color-text-success, #14ae5c);
  }
  .ko {
    color: var(--figma-color-text-danger, #f24822);
  }
  .muted {
    color: var(--figma-color-text-secondary, #666);
  }
  code {
    font-family: ui-monospace, monospace;
    font-size: 11px;
  }
  ul {
    margin: 4px 0;
    padding-left: 16px;
  }
  #error {
    white-space: pre-wrap;
  }
  .row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .row input[type='checkbox'] {
    width: auto;
  }
</style>

<h1>DS-Studio</h1>
<p class="muted">Écrit la dernière version acceptée de l’atelier dans ce fichier, et renvoie ses composants à l’atelier.</p>

<form id="connect">
  <label for="addr">Adresse de l’atelier</label>
  <input id="addr" value="http://localhost:4310" />
  <label for="code">Code d’appairage (bouton « Figma » dans l’atelier)</label>
  <input id="code" placeholder="xxxx-xxxx-xxxx" autocomplete="off" />
  <button type="submit">Connecter</button>
</form>

<div id="main" hidden>
  <label for="project">Projet</label>
  <select id="project"></select>
  <div id="details"></div>
</div>
<p id="status" class="muted"></p>
<p id="error" class="ko" role="alert"></p>

<script>
  const $ = (id) => document.getElementById(id);
  const send = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
  const state = { file: null, projects: [], payload: null };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const setError = (m) => ($('error').textContent = m || '');
  const setStatus = (m) => ($('status').textContent = m || '');

  async function api(route, body) {
    const res = await fetch($('addr').value.replace(/\/+$/, '') + '/api/plugin/' + route, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'X-DS-Plugin': $('code').value.trim(), ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
    return data;
  }
  const slug = () => $('project').value;

  $('connect').onsubmit = async (e) => {
    e.preventDefault();
    setError('');
    try {
      state.projects = await api('projects');
      send({ type: 'save-settings', settings: { addr: $('addr').value, code: $('code').value.trim(), project: slug() } });
      $('project').innerHTML = state.projects.map((p) => `<option value="${esc(p.slug)}">${esc(p.name)}</option>`).join('');
      // Projet dont la cible est ce fichier, sinon le dernier choisi.
      const mine = state.projects.find((p) => p.figma && p.figma.fileKey === (state.file && state.file.key));
      if (mine) $('project').value = mine.slug;
      else if (state.saved && state.projects.some((p) => p.slug === state.saved)) $('project').value = state.saved;
      $('main').hidden = false;
      setStatus(`Connecté · ${state.projects.length} projet(s)`);
      await loadProject();
    } catch (err) {
      setError(`Atelier injoignable ou code refusé : ${err.message}`);
    }
  };
  $('project').onchange = () => {
    send({ type: 'save-settings', settings: { addr: $('addr').value, code: $('code').value.trim(), project: slug() } });
    loadProject();
  };

  async function loadProject() {
    setError('');
    const p = state.projects.find((x) => x.slug === slug());
    state.payload = null;
    let html = '';
    const file = state.file || {};
    const target = p.figma && p.figma.fileKey;
    const match = target && file.key === target;
    html += `<div class="card"><strong>Fichier ouvert</strong> · ${esc(file.name || '')}<br><code>${esc(file.key || 'non identifié')}</code>${file.key && !file.native ? ' <span class="muted">(lié)</span>' : ''}<br>`;
    html += target
      ? `Cible du projet : <code>${esc(target)}</code> · <span class="${match ? 'ok' : 'ko'}">${match ? 'c’est ce fichier' : 'autre fichier'}</span>`
      : '<span class="muted">Ce projet n’a pas de cible Figma : transfert impossible.</span>';
    if (target && !file.key)
      html += `<div class="row"><input type="checkbox" id="confirm-link"><label for="confirm-link">Ce fichier est bien la cible de ${esc(p.name)}</label></div><button id="link">Lier ce fichier au projet</button>`;
    const owner = state.projects.find((x) => x.figma && x.figma.fileKey === file.key);
    if (!target && file.key && file.native)
      html += owner
        ? `<br><span class="muted">Ce fichier est déjà la cible de ${esc(owner.name)}.</span>`
        : `<div class="row"><input type="checkbox" id="confirm-target"><label for="confirm-target">« ${esc(file.name)} » est bien le fichier de ${esc(p.name)}</label></div><button id="set-target">Faire de ce fichier la cible de ${esc(p.name)}</button>`;
    html += '</div>';

    if (p.version && target) {
      try {
        state.payload = await api(`payload?project=${encodeURIComponent(p.slug)}`);
        const v = state.payload;
        const comps = (v.components || []).filter((c) => c.status === 'figma').map((c) => c.name);
        html += `<h2>Transférer</h2><div class="card">Version <strong>v${v.revision}</strong> · ${new Date(v.acceptedAt).toLocaleString('fr-FR')} · <code>${v.hash.slice(0, 8)}</code>${v.findings ? ` · ${v.findings} écart(s)` : ''}<ul>`;
        for (const c of v.collections) html += `<li>${esc(c.name)} : ${c.variables.length} variables · ${c.modes.map(esc).join(' / ')}</li>`;
        html += `<li>Composants : ${comps.length ? comps.map(esc).join(', ') : 'aucun'}</li></ul>`;
        html += `<span class="muted">Écrit dans la page « ${esc(v.target.page)} » et ces trois collections. Rien n’est supprimé ni renommé.</span>`;
        if (v.transferred && v.transferred.hash === v.hash)
          html += `<br><span class="ok">Déjà transférée le ${new Date(v.transferred.date).toLocaleString('fr-FR')}.</span>`;
        html += `<button class="primary" id="transfer" ${match ? '' : 'disabled'}>Transférer v${v.revision}${v.transferred && v.transferred.hash === v.hash ? ' à nouveau' : ''}</button></div>`;
      } catch (err) {
        html += `<p class="ko">${esc(err.message)}</p>`;
      }
    } else if (!p.version) html += '<p class="muted">Aucune version acceptée : accepte une version dans l’atelier.</p>';

    // Composants d'un autre fichier que la cible : jamais envoyés à ce projet.
    const sendable = !target || match;
    html += `<h2>Envoyer les composants</h2><div class="card"><span class="muted">Lit les composants de ce fichier (lecture seule) et les envoie à l’atelier comme fiches à relire. Rien n’est écrit sans ton diff.</span>`;
    if (!sendable) html += `<br><span class="ko">Ce fichier n’est pas celui de ${esc(p.name)} : ouvre son fichier cible pour envoyer ses composants.</span>`;
    else if (!target) html += `<br><span class="ko">${esc(p.name)} n’a pas de fichier cible : vérifie que « ${esc(file.name || '')} » est bien le sien.</span>`;
    html += `<button id="components" ${sendable ? '' : 'disabled'}>Envoyer les composants de « ${esc(file.name || 'ce fichier')} » à ${esc(p.name)}</button></div>`;

    if (match)
      html += `<h2>Remettre à zéro</h2><div class="card"><span class="muted">Supprime de ce fichier ce que DS-Studio y a écrit (ses collections, leurs variables, la page « ${esc(p.figma.page)} »), rien d’autre. Tu vois la liste avant de confirmer.</span><div id="reset-zone"><button id="reset-plan">Préparer la remise à zéro…</button></div></div>`;
    $('details').innerHTML = html;

    if ($('set-target'))
      $('set-target').onclick = async () => {
        if (!$('confirm-target').checked) return setError('Coche la confirmation avant de faire de ce fichier la cible.');
        try {
          await api(`target?project=${encodeURIComponent(p.slug)}`, { fileKey: file.key });
          state.projects = await api('projects');
          setStatus(`« ${file.name} » est maintenant la cible de ${p.name}.`);
          await loadProject();
        } catch (err) {
          setError(err.message);
        }
      };
    if ($('reset-plan'))
      $('reset-plan').onclick = () => {
        $('reset-plan').disabled = true;
        setStatus('Inventaire de ce que DS-Studio a écrit…');
        send({ type: 'reset-plan', target: p.figma, known: p.known });
      };

    if ($('link'))
      $('link').onclick = () => {
        if (!$('confirm-link').checked) return setError('Coche la confirmation avant de lier ce fichier.');
        send({ type: 'link-file', fileKey: target });
      };
    if ($('transfer'))
      $('transfer').onclick = () => {
        $('transfer').disabled = true;
        setStatus('Transfert en cours…');
        send({ type: 'transfer', payload: state.payload, known: p.known });
      };
    $('components').onclick = () => {
      $('components').disabled = true;
      setStatus('Lecture des composants du fichier…');
      send({ type: 'read-components' });
    };
  }

  const current = () => state.projects.find((x) => x.slug === slug());

  // Confirmation de la remise à zéro : liste exacte de ce qui sera supprimé.
  function showResetPlan(plan) {
    const zone = $('reset-zone');
    if (!plan.collections.length && !plan.page) {
      zone.innerHTML = '<p class="muted">Rien à supprimer : DS-Studio n’a rien écrit dans ce fichier.</p>';
      return;
    }
    const vars = plan.collections.reduce((n, c) => n + c.variables, 0);
    let html = '<p class="ko"><strong>Va être supprimé de ce fichier :</strong></p><ul>';
    for (const c of plan.collections) html += `<li>Collection « ${esc(c.name)} » : ${c.variables} variable(s)</li>`;
    if (plan.page)
      html += `<li>${plan.onlyPage ? 'Contenu de la' : 'Page'} « ${esc(plan.page.name)} » : ${plan.page.layers} calque(s)${plan.components.length ? `, dont ${plan.components.map(esc).join(', ')}` : ''}</li>`;
    html += '</ul>';
    if (vars) html += '<p class="muted">Les calques d’autres pages qui utilisent ces variables perdent le lien avec elles.</p>';
    if (plan.elsewhere) html += `<p class="ko">${plan.elsewhere} instance(s) posée(s) sur d’autres pages resteront, sans composant principal.</p>`;
    html +=
      '<p class="muted">Conseil : avant, enregistre une version (Fichier → Enregistrer dans l’historique des versions).</p>' +
      '<div class="row"><input type="checkbox" id="confirm-reset"><label for="confirm-reset">Je confirme la suppression</label></div>' +
      '<button class="danger" id="reset">Supprimer définitivement</button><button id="reset-cancel">Annuler</button>';
    zone.innerHTML = html;
    $('reset-cancel').onclick = () => loadProject();
    $('reset').onclick = () => {
      if (!$('confirm-reset').checked) return setError('Coche la confirmation avant de supprimer.');
      $('reset').disabled = true;
      setError('');
      setStatus('Remise à zéro en cours…');
      const p = current();
      send({ type: 'reset', target: p.figma, known: p.known });
    };
  }

  onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    try {
      if (msg.type === 'init') {
        state.file = msg.file;
        state.saved = msg.settings.project;
        if (msg.settings.addr) $('addr').value = msg.settings.addr;
        if (msg.settings.code) {
          $('code').value = msg.settings.code;
          $('connect').requestSubmit();
        }
      } else if (msg.type === 'file') {
        state.file = msg.file;
        await loadProject();
      } else if (msg.type === 'transferred') {
        const r = msg.report;
        const v = state.payload;
        await api(`transfer?project=${encodeURIComponent(slug())}`, { revision: v.revision, hash: v.hash, fileKey: v.target.fileKey, report: r });
        setStatus(
          `v${v.revision} transférée : ${r.created} variable(s) créée(s), ${r.updated} mise(s) à jour` +
            (r.components.length ? `, ${r.components.join(', ')} construit` : '') +
            (r.extra.length ? ` · ${r.extra.length} variable(s) Figma hors version, conservée(s)` : '') +
            (r.skipped.length ? `\nÀ voir : ${r.skipped.join(' ; ')}` : ''),
        );
        await loadProject();
      } else if (msg.type === 'components') {
        const res = await api(`components?project=${encodeURIComponent(slug())}`, msg.raw);
        setStatus(`${res.count} fiche(s) envoyée(s) à l’atelier : ouvre-le, bouton « Fiches reçues de Figma », puis relis le diff.`);
        $('components').disabled = false;
      } else if (msg.type === 'reset-plan') {
        setStatus('');
        showResetPlan(msg.plan);
      } else if (msg.type === 'reset-done') {
        const r = msg.removed;
        const p = current();
        await api(`reset?project=${encodeURIComponent(p.slug)}`, { fileKey: p.figma.fileKey, removed: r });
        state.projects = await api('projects');
        setStatus(
          `Remise à zéro faite : ${r.collections.length} collection(s), ${r.variables} variable(s)` +
            (r.page ? `, page « ${r.page} »` : '') +
            (r.components.length ? `, ${r.components.join(', ')}` : '') +
            ' supprimés. Historique des versions Figma pour revenir en arrière.',
        );
        await loadProject();
      } else if (msg.type === 'error') {
        setStatus('');
        await loadProject();
        setError(msg.message);
      }
    } catch (err) {
      setError(err.message);
    }
  };
  send({ type: 'init' });
</script>
